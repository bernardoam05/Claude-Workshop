# Contrato da API em OpenAPI 3.1 (o formato "Swagger").
# Nas empresas, é este ficheiro que o frontend, os testers e outras equipas leem para saber como usar a API.
# Swagger UI (com o compose a correr): http://localhost:8088
openapi: 3.1.0
info:
  title: Workshop · Gestor de tarefas
  version: 1.0.0
  description: |
    API REST do workshop. Todas as rotas de tarefas exigem um token Bearer,
    obtido em /auth/login (modo manual) ou no Keycloak (OIDC).
servers:
  - url: http://localhost:8080/api
    description: Através do Nginx (compose)
  - url: http://localhost:8081/api
    description: Através do Nginx com WEB_PORT=8081

tags:
  - name: auth
  - name: tasks
  - name: system

paths:
  /health:
    get:
      tags: [system]
      summary: Estado da API e das dependências
      security: []
      responses:
        '200':
          description: Tudo operacional
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, const: ok } } }
        '503':
          description: Uma dependência (BD ou Redis) está em baixo

  /auth/config:
    get:
      tags: [auth]
      summary: Formas de autenticação disponíveis
      security: []
      responses:
        '200':
          description: Configuração pública
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }

  /auth/register:
    post:
      tags: [auth]
      summary: Criar conta local
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email já registado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [auth]
      summary: Login com conta local
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks:
    get:
      tags: [tasks]
      summary: Listar as tarefas do utilizador autenticado
      responses:
        '200':
          description: Lista de tarefas (mais recentes primeiro)
          headers:
            X-Cache:
              description: HIT se a resposta veio do Redis, MISS se veio da BD
              schema: { type: string, enum: [HIT, MISS] }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tasks]
      summary: Criar uma tarefa (publica o evento task.created)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: Tarefa criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      tags: [tasks]
      summary: Marcar como concluída ou por concluir (publica task.completed na transição para concluída)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '200':
          description: Tarefa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      summary: Apagar uma tarefa
      responses:
        '204': { description: Apagada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stats:
    get:
      tags: [tasks]
      summary: Estatísticas do utilizador (processedCompleted depende do worker, consistência eventual)
      responses:
        '200':
          description: Contadores
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  done: { type: integer }
                  processedCompleted: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token local (HS256) ou access token do Keycloak (RS256, aud=workshop-api)

  schemas:
    Task:
      type: object
      required: [id, title, done, created_at, userId]
      properties:
        id: { type: integer }
        title: { type: string }
        done: { type: boolean }
        created_at: { type: string, format: date-time }
        userId: { type: integer }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72 }
    AuthResult:
      type: object
      properties:
        token: { type: string }
        user:
          type: object
          properties:
            id: { type: integer }
            email: { type: string }
    AuthConfig:
      type: object
      properties:
        local: { type: boolean }
        oidc:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                issuer: { type: string, format: uri }
                clientId: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

  responses:
    BadRequest:
      description: Pedido inválido (validação falhou)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Token em falta, inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Não existe (ou pertence a outro utilizador)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
