server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker. valid=10s: o Nginx volta a perguntar o IP de "api" a cada 10 segundos.
  # Sem isto, o Nginx resolve "api" UMA VEZ no arranque e guarda o IP para sempre:
  # quando a API é recriada (novo deploy, novo IP), o Nginx continua a enviar para o IP antigo → 502.
  resolver 127.0.0.11 valid=10s;

  # Ficheiros estáticos. try_files: se o caminho não existir, devolve index.html
  # (a aplicação React decide o que mostrar). Isto é o comportamento de uma SPA.
  location / {
    try_files $uri /index.html;
  }

  # Reverse proxy: pedidos /api/* são reencaminhados para o serviço "api".
  # Usar uma VARIÁVEL no proxy_pass é o que obriga o Nginx a usar o resolver em cada pedido.
  # Sem caminho depois do host, o URI original (/api/...) é enviado tal como chegou.
  # Microserviço Java (Spring Boot). O Nginx escolhe o "location" com o prefixo MAIS LONGO,
  # por isso /api/activity/... vai para aqui e o resto de /api/... para a API Node.
  # Para o browser continua a ser uma só origem: o utilizador não sabe que há dois backends.
  location /api/activity/ {
    set $activity_upstream activity:8080;
    proxy_pass http://$activity_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
